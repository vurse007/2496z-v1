[package]
name = "v1-2496z"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = "fat"

# These fields configure default behavior for uploads with `cargo v5`.
[package.metadata.v5]
upload-strategy = "differential"
slot = 1
icon = "cool-x"
compress = true

[dependencies]
vexide = { version = "0.8.0", features = ["full", "default-sdk"] }
futures-util = { version = "0.3.34", default-features = false, features = ["async-await-macro"] } #for join!() -> run two motions at once in auton

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
